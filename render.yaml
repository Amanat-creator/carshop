databases:
  - name: carshop-db
    databaseName: carshop
    user: carshop_user
    plan: free

services:
  - type: web
    name: carshop
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn carshop.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carshop-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4